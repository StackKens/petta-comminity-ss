kind = "web"
previewPath = "/"
title = "Petta Community Secondary School"
description = "A premium, responsive school website for Petta Community Secondary School in Uganda, presenting its O-Level and A-Level education, admissions, academics, student life, facilities, news, leadership, and contact information without inventing school-specific facts."
version = "1.0.0"
id = "artifacts/petta-school"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19890

[services.development]
run = "pnpm --filter @workspace/petta-school run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/petta-school", "run", "build" ]
serve = "static"
publicDir = "artifacts/petta-school/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19890"
BASE_PATH = "/"
